<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Paciente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .avatar { width: 120px; height: 120px; }
    .badge-sangue { position: absolute; bottom: -8px; right: -8px; }
  </style>
</head>
<body class="bg-gray-50 p-6">

  <!-- Cartão principal -->
  <div class="max-w-sm mx-auto bg-white rounded-2xl shadow-md p-8 border border-gray-200">

    <!-- Avatar com badge sangue -->
    <div class="flex justify-center mb-6 relative">
      <img src="https://via.placeholder.com/120" alt="João P. Moraes" class="avatar rounded-full object-cover border-4 border-gray-100">
    </div>

    <!-- Dados principais -->
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-gray-800">João P. Moraes</h1>
      <p class="text-sm text-gray-500 mt-1">CPF: 123.456.789-00</p>
    </div>

    <!-- Informações vitais -->
    <div class="grid grid-cols-2 gap-4 mb-8 pb-8 border-b border-gray-200">
      <div>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Idade</p>
        <p class="text-lg font-bold text-gray-800 mt-1">45 anos</p>
      </div>
      <div>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Sangue</p>
        <p class="text-lg font-bold text-red-600 mt-1">O+</p>
      </div>
    </div>

    <!-- Seção dados pessoais -->
    <div class="mb-6">
      <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wide mb-4">Dados Pessoais</h2>
      
      <!-- Data nascimento -->
      <div class="mb-4">
        <p class="text-xs text-gray-500 font-semibold uppercase mb-1">Data de Nascimento</p>
        <p class="text-sm text-gray-800">15 de Maio, 1978</p>
      </div>

      <!-- Endereço -->
      <div class="mb-4">
        <p class="text-xs text-gray-500 font-semibold uppercase mb-1">Endereço</p>
        <p class="text-sm text-gray-800">Rua das Flores, 123 - Centro, São Paulo - SP</p>
      </div>

      <!-- Contato -->
      <div class="mb-4">
        <p class="text-xs text-gray-500 font-semibold uppercase mb-1">Contato</p>
        <p class="text-sm text-gray-800">(11) 98765-4321</p>
      </div>

      <!-- Email -->
      <div>
        <p class="text-xs text-gray-500 font-semibold uppercase mb-1">E-mail</p>
        <p class="text-sm text-gray-800">joao.silva@email.com</p>
      </div>
    </div>

    <!-- Botão ação -->
    <button class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-3">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      Ver Laudos
    </button>
  </div>

</body>
</html>
